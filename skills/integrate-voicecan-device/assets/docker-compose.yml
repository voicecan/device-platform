services:
  migrate:
    image: ${VOICECAN_DEVICE_IMAGE:?set a pinned image tag or digest}
    command: ["node", "packages/device-server/dist/cli.js", "migrate"]
    env_file:
      - path: .env
        required: false
    volumes:
      - voicecan-device-data:/data
    restart: "no"

  device-server:
    image: ${VOICECAN_DEVICE_IMAGE:?set a pinned image tag or digest}
    command: ["node", "packages/device-server/dist/cli.js", "serve"]
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${VOICECAN_PORT:-8787}:8787"
    volumes:
      - voicecan-device-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  voicecan-device-data:
