server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; trusted-types voicecan lit-html sanitizer; require-trusted-types-for 'script'" always;
  add_header Permissions-Policy "bluetooth=(self), camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "unsafe-none" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cache-Control "no-store" always;

  location / { try_files $uri $uri/ /index.html; }
}
