openapi: 3.1.0
info:
  title: Voicecan Independent Device Server
  version: 0.1.0-preview.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: vc_session }
    bindingBrowser: { type: apiKey, in: cookie, name: vc_binding }
    groupToken: { type: http, scheme: bearer }
    applicationToken: { type: http, scheme: bearer, bearerFormat: vcd_app_opaque }
  schemas:
    Envelope:
      type: object
      required: [success, code, message, data, request_id]
      properties:
        success: { const: true }
        code: { const: "" }
        message: { const: success }
        data: {}
        request_id: { type: string }
    Error:
      type: object
      required: [success, code, message, request_id]
      properties:
        success: { const: false }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string }
        request_id: { type: string }
    SetupStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [setup_pending, ready] }
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, display_name, role, group_id, membership_role]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, 'null'] }
        role: { type: string, enum: [system_admin, user] }
        group_id: { type: [string, 'null'] }
        membership_role: { type: [string, 'null'], enum: [group_admin, member, null] }
    Device:
      type: object
      required: [id, display_name, manufacturer, sn, model, hardware_version, firmware_version, group_id, ownership_epoch, online, last_seen_at, created_at, updated_at]
      properties:
        id: { type: string }
        display_name: { type: [string, 'null'], maxLength: 80 }
        manufacturer: { type: string }
        sn: { type: string }
        model: { type: [string, 'null'] }
        hardware_version: { type: [string, 'null'] }
        firmware_version: { type: [string, 'null'] }
        group_id: { type: string }
        ownership_epoch: { type: integer, minimum: 1 }
        online: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecordingFile:
      type: object
      required: [id, device_id, session_id, attribute, revision, expected_size, actual_size, sha256, status, transport, media, timing, source_firmware_version, resource_version, created_at, synced_at, legal_hold, legal_hold_reason, deletion_status, deletion_requested_at, object_deleted_at]
      properties:
        id: { type: string }
        device_id: { type: string }
        session_id: { type: integer, minimum: 0 }
        attribute: { type: integer, minimum: 0, maximum: 2 }
        revision: { type: integer, minimum: 1 }
        expected_size: { type: integer, minimum: 1 }
        actual_size: { type: [integer, 'null'], minimum: 0 }
        sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [pending, syncing, synced, blocked, failed, identity_conflict, canceled] }
        transport: { type: [string, 'null'], enum: [filesystem_http, s3_direct, server_relay, null] }
        media: { $ref: '#/components/schemas/RecordingMediaDescriptor' }
        timing: { $ref: '#/components/schemas/RecordingTiming' }
        source_firmware_version: { type: [string, 'null'] }
        resource_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        synced_at: { type: [string, 'null'], format: date-time }
        legal_hold: { type: boolean }
        legal_hold_reason: { type: [string, 'null'] }
        deletion_status: { type: string, enum: [active, requested, failed, object_deleted] }
        deletion_requested_at: { type: [string, 'null'], format: date-time }
        object_deleted_at: { type: [string, 'null'], format: date-time }
    RecordingMediaDescriptor:
      type: object
      additionalProperties: false
      required: [schema_version, container, codec, content_type, filename_extension, sample_rate_hz, channels, bit_depth, duration_ms, encoding_profile, source]
      properties:
        schema_version: { const: recording.media.v1 }
        container: { type: [string, 'null'] }
        codec: { type: [string, 'null'] }
        content_type: { type: string, default: application/octet-stream }
        filename_extension: { type: string, default: bin }
        sample_rate_hz: { type: [integer, 'null'], minimum: 1 }
        channels: { type: [integer, 'null'], minimum: 1 }
        bit_depth: { type: [integer, 'null'], minimum: 1 }
        duration_ms: { type: [integer, 'null'], minimum: 1 }
        encoding_profile: { type: [string, 'null'] }
        source: { type: string, enum: [device, firmware_mapping, server_verified, unknown] }
    RecordingTiming:
      type: object
      additionalProperties: false
      required: [device_started_at, device_ended_at, duration_ms, device_timezone_offset_minutes, discovered_at, synced_at]
      properties:
        device_started_at: { type: [string, 'null'], format: date-time }
        device_ended_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'], minimum: 1 }
        device_timezone_offset_minutes: { type: [integer, 'null'], minimum: -840, maximum: 840 }
        discovered_at: { type: string, format: date-time }
        synced_at: { type: [string, 'null'], format: date-time }
    DeviceCapabilityManifest:
      type: object
      additionalProperties: false
      required: [schema_version, device_id, model, firmware_version, capability_version, source, changed_at, recording, sync, commands, unknown_capabilities]
      properties:
        schema_version: { const: device.capabilities.v1 }
        device_id: { type: string }
        model: { type: [string, 'null'] }
        firmware_version: { type: [string, 'null'] }
        capability_version: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        source: { type: string, enum: [platform_reviewed, unknown] }
        changed_at: { type: [string, 'null'], format: date-time }
        recording: { type: object, required: [supported, media_profiles, max_duration_seconds], properties: { supported: { type: boolean }, media_profiles: { type: array, items: { type: string } }, max_duration_seconds: { type: [integer, 'null'], minimum: 1 } } }
        sync: { type: object, required: [manual_trigger, inventory], properties: { manual_trigger: { type: boolean }, inventory: { type: boolean } } }
        commands: { type: array, items: { const: recording.sync } }
        unknown_capabilities: { type: array, items: { type: string } }
    DeviceEvent:
      type: object
      additionalProperties: false
      required: [id, type, api_version, created_at, data]
      properties:
        id: { type: string }
        type: { type: string }
        api_version: { const: '2026-08-07' }
        created_at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    Command:
      type: object
      additionalProperties: false
      required: [id, type, device_id, status, idempotency_key, requested_at, dispatched_at, started_at, completed_at, expires_at, result_code, error_code, resource_version]
      properties:
        id: { type: string }
        type: { const: recording.sync }
        device_id: { type: string }
        status: { type: string, enum: [queued, dispatched, running, succeeded, failed, expired] }
        idempotency_key: { type: string }
        requested_at: { type: string, format: date-time }
        dispatched_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
        result_code: { type: [string, 'null'] }
        error_code: { type: [string, 'null'] }
        resource_version: { type: integer, minimum: 1 }
    CursorPageFiles:
      type: object
      additionalProperties: false
      required: [items, next_cursor, count, total_count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecordingFile' } }
        next_cursor: { type: [string, 'null'] }
        count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
    CursorPageEvents:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeviceEvent' } }
        next_cursor: { type: [string, 'null'] }
    ProvisioningGrant:
      type: object
      additionalProperties: false
      required: [id, provisioning_token, expires_at]
      properties:
        id: { type: string }
        provisioning_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    ProvisioningClaim:
      type: object
      additionalProperties: false
      required: [provisioning_session_id, continuation_token, device_id, device_token, wss_url]
      properties:
        provisioning_session_id: { type: string }
        continuation_token: { type: string, writeOnly: true }
        device_id: { type: string }
        display_name: { type: [string, 'null'] }
        device_token: { type: string, writeOnly: true }
        wss_url: { type: string, format: uri, pattern: '^wss?://' }
        recovered: { type: boolean, description: True when the encrypted temporary credential from an earlier incomplete attempt was safely reused. }
    DeviceAccessSettings:
      type: object
      additionalProperties: false
      required: [ble_name_prefix]
      properties:
        ble_name_prefix: { type: string, minLength: 1, maxLength: 24 }
    TransferOutGrant:
      type: object
      additionalProperties: false
      required: [id, transfer_token, expires_at]
      properties:
        id: { type: string }
        transfer_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    TransferOutClaim:
      type: object
      additionalProperties: false
      required: [id, continuation_token, device_id, manufacturer, serial_number, sealed_device_token, algorithm]
      properties:
        id: { type: string }
        continuation_token: { type: string, writeOnly: true }
        device_id: { type: string }
        manufacturer: { type: string }
        serial_number: { type: string }
        sealed_device_token: { type: string, writeOnly: true }
        algorithm: { const: RSA-OAEP-256 }
    EventEndpoint:
      type: object
      required: [id, group_id, url, enabled, created_at]
      properties:
        id: { type: string }
        group_id: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        secret_id: { type: string }
        next_secret_id: { type: [string, 'null'] }
        next_activates_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Delivery:
      type: object
      required: [id, event_id, status, attempts, created_at]
      properties:
        id: { type: string }
        event_id: { type: string }
        replay_namespace: { type: [string, 'null'] }
        status: { type: string, enum: [pending, delivered, dead, canceled] }
        attempts: { type: integer, minimum: 0 }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    StorageState:
      type: object
      required: [driver, driver_source, driver_change_requires_restart, supported_drivers, deployment_profile, max_file_bytes, max_storage_bytes, warning_ratio, stop_ratio, active_transfers, stored_bytes]
      properties:
        driver: { type: string, enum: [filesystem_http, s3_direct, server_relay] }
        driver_source: { const: deployment_environment }
        driver_change_requires_restart: { const: true }
        supported_drivers: { type: array, items: { type: string, enum: [filesystem_http, s3_direct, server_relay] } }
        deployment_profile: { type: string, enum: [development, edge, production] }
        max_file_bytes: { type: integer, minimum: 1 }
        max_storage_bytes: { type: integer, minimum: 1 }
        warning_ratio: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        stop_ratio: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
        settings_updated_at: { type: [string, 'null'], format: date-time }
        active_transfers: { type: integer, minimum: 0 }
        stored_bytes: { type: integer, minimum: 0 }
        capacity: { type: [object, 'null'] }
    OpenPlatformApplication:
      type: object
      required: [id, group_id, name, environment, status, channels, owner_user_id, version, created_at, updated_at]
      properties:
        id: { type: string }
        group_id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        environment: { type: string, enum: [development, staging, production] }
        status: { type: string, enum: [active, suspended, archived] }
        channels: { type: array, items: { type: string, enum: [rest, mcp_stdio, mcp_remote, webhook] } }
        owner_user_id: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecordingDownloadLink:
      type: object
      additionalProperties: false
      required: [grant_id, download_url, expires_at, purpose, content_length, content_type, filename, sha256, range_supported, delivery]
      properties:
        grant_id: { type: string }
        download_url: { type: string, format: uri, writeOnly: true }
        expires_at: { type: string, format: date-time }
        purpose: { const: download }
        content_length: { type: integer, minimum: 0 }
        content_type: { type: string }
        filename: { type: string }
        sha256: { type: [string, 'null'] }
        range_supported: { type: boolean }
        delivery: { const: external_temporary_url }
    SetupAdminRequest:
      type: object
      additionalProperties: false
      required: [setup_token, username, password]
      properties:
        setup_token: { type: string, writeOnly: true }
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        display_name: { type: string, maxLength: 128 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, maxLength: 256, writeOnly: true }
    PublicCommandRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties: { kind: { const: sync } }
    ProvisioningGrantRequest:
      type: object
      additionalProperties: false
      required: [allowed_origin]
      properties:
        group_id: { type: string }
        allowed_origin: { type: string, format: uri }
        connector_origin: { type: string, format: uri, description: Trusted configured Device Connect origin used when an HTTP LAN Admin proxies a secure remote provisioning flow. }
        expected_sn: { type: string, maxLength: 128 }
    ProvisioningClaimRequest:
      type: object
      additionalProperties: false
      required: [provisioning_token, manufacturer, serial_number]
      properties:
        provisioning_token: { type: string, writeOnly: true }
        manufacturer: { type: string, maxLength: 64 }
        serial_number: { type: string, maxLength: 128 }
        bluetooth_name: { type: string, maxLength: 248, description: Bluetooth advertised name used as the initial device display name. Existing display names are never overwritten. }
        model: { type: string, maxLength: 64 }
        firmware_version: { type: string, maxLength: 64 }
        device_ws_url: { type: string, format: uri, pattern: '^wss?://', description: Optional per-provisioning override; otherwise the Server uses its configured URL, request host, or detected LAN IP. }
    ProvisioningProgressRequest:
      type: object
      additionalProperties: false
      required: [continuation_token, stage]
      properties:
        continuation_token: { type: string, writeOnly: true }
        stage: { type: string, enum: [ble_authenticated, configured, failed] }
        failure_code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    TransferOutGrantRequest:
      type: object
      additionalProperties: false
      required: [allowed_origin, reason]
      properties:
        allowed_origin: { type: string, format: uri }
        reason: { type: string, minLength: 1, maxLength: 256 }
    TransferOutClaimRequest:
      type: object
      additionalProperties: false
      required: [transfer_token, public_key_jwk]
      properties:
        transfer_token: { type: string, writeOnly: true }
        public_key_jwk: { type: object, additionalProperties: true, writeOnly: true }
    TransferOutCompleteRequest:
      type: object
      additionalProperties: false
      required: [continuation_token, serial_number, result]
      properties:
        continuation_token: { type: string, writeOnly: true }
        serial_number: { type: string, maxLength: 128 }
        result: { type: string, enum: [ack, failed] }
        failure_code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    SetupStatusEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/SetupStatus' } }
    AuthUserEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/AuthUser' } }
    DeviceEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/Device' } }
    DeviceListEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Device' } } }
    FileEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/RecordingFile' } }
    FilePageEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/CursorPageFiles' } }
    EventPageEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/CursorPageEvents' } }
    CommandEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/Command' } }
    ProvisioningGrantEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/ProvisioningGrant' } }
    ProvisioningClaimEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/ProvisioningClaim' } }
    TransferOutGrantEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/TransferOutGrant' } }
    TransferOutClaimEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties: { data: { $ref: '#/components/schemas/TransferOutClaim' } }
paths:
  /.well-known/oauth-authorization-server:
    servers: [{ url: / }]
    get:
      summary: OAuth Authorization Server Metadata including Dynamic Client Registration discovery
      responses:
        '200':
          description: OAuth server metadata
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint]
                properties:
                  issuer: { type: string, format: uri }
                  authorization_endpoint: { type: string, format: uri }
                  token_endpoint: { type: string, format: uri }
                  registration_endpoint: { type: string, format: uri }
  /oauth/register:
    servers: [{ url: / }]
    post:
      summary: Dynamically register an unprivileged public Remote MCP OAuth client (RFC 7591)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uri } }
                client_name: { type: string, maxLength: 120 }
                token_endpoint_auth_method: { const: none, default: none }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                response_types: { type: array, items: { const: code } }
                scope: { type: string }
                application_type: { type: string, enum: [native, web] }
      responses:
        '201': { description: Public client metadata with client_id and no client secret }
        '400': { description: RFC 7591 invalid_redirect_uri or invalid_client_metadata error }
        '429': { description: Anonymous registration rate limit exceeded }
  /setup/status:
    get:
      summary: Check setup state
      responses:
        '200':
          description: setup_pending or ready
          content: { application/json: { schema: { $ref: '#/components/schemas/SetupStatusEnvelope' } } }
  /setup/admin:
    post:
      summary: Atomically create the first System Admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetupAdminRequest' } } }
      responses: { '201': { description: Created }, '403': { description: Invalid, expired, or consumed setup token } }
  /auth/login:
    post:
      summary: Create a human session
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses: { '200': { description: Session cookie and CSRF token }, '401': { description: Invalid credentials }, '429': { description: Rate limited } }
  /auth/logout:
    post: { summary: Revoke current session, security: [{ sessionCookie: [] }], responses: { '200': { description: Revoked } } }
  /auth/me:
    get:
      summary: Current user and membership
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current identity
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthUserEnvelope' } } }
  /auth/csrf:
    get:
      summary: Refresh the CSRF token for the current human session
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Refreshed CSRF token and same-origin cookie }, '401': { description: Session expired } }
  /settings/device-access:
    get:
      summary: Read the server-wide nearby-device discovery settings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Device access settings
          content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAccessSettings' } } }
    patch:
      summary: Update nearby-device discovery settings as System Admin
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAccessSettings' } } }
      responses: { '200': { description: Updated }, '400': { description: Invalid BLE name prefix }, '403': { description: System Admin required } }
  /auth/change-password:
    post: { summary: Change current password and revoke sessions, security: [{ sessionCookie: [] }], responses: { '200': { description: Changed } } }
  /users:
    get: { summary: List local users, security: [{ sessionCookie: [] }], responses: { '200': { description: Users } } }
    post: { summary: Create a local user, security: [{ sessionCookie: [] }], responses: { '201': { description: Created } } }
  /users/{id}:
    patch: { summary: Update role, identity, or disabled state with last-admin guards, security: [{ sessionCookie: [] }], responses: { '200': { description: Updated }, '409': { description: Lifecycle guard } } }
    delete: { summary: Delete an unused local user, security: [{ sessionCookie: [] }], responses: { '200': { description: Deleted }, '409': { description: User has dependencies } } }
  /users/{id}/password:
    put: { summary: Set a local user password and revoke sessions, security: [{ sessionCookie: [] }], responses: { '200': { description: Changed }, '404': { description: Missing or unauthorized } } }
  /user-groups:
    get: { summary: List visible groups, security: [{ sessionCookie: [] }], responses: { '200': { description: Groups } } }
    post: { summary: Create group with one administrator, security: [{ sessionCookie: [] }], responses: { '201': { description: Created } } }
  /user-groups/{id}:
    patch: { summary: Rename or archive a dependency-free group, security: [{ sessionCookie: [] }], responses: { '200': { description: Updated }, '409': { description: Group still owns devices } } }
  /user-groups/{id}/members:
    get: { summary: List active members, security: [{ sessionCookie: [] }], responses: { '200': { description: Members } } }
    put: { summary: Add an active member, security: [{ sessionCookie: [] }], responses: { '201': { description: Added } } }
  /user-groups/{id}/members/{userId}:
    delete: { summary: Remove a non-admin member and revoke sessions, security: [{ sessionCookie: [] }], responses: { '200': { description: Removed }, '409': { description: Member cannot be removed } } }
  /user-groups/{id}/transfer-admin:
    post: { summary: Atomically transfer the active Group Admin role, security: [{ sessionCookie: [] }], responses: { '200': { description: Transferred } } }
  /user-groups/{id}/api-tokens:
